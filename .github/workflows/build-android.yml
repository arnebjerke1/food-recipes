name: Build Forkful Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: forkful-v2/package-lock.json

      - name: Install dependencies
        working-directory: forkful-v2
        run: npm ci

      - name: Build web app for Android
        working-directory: forkful-v2
        run: VITE_CAPACITOR=true npm run build

      - name: Sync Capacitor
        working-directory: forkful-v2
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        working-directory: forkful-v2/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: forkful-v2/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: forkful-debug-${{ github.run_number }}
          path: forkful-v2/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
